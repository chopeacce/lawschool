<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>D-day</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:transparent;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;color:#222}
.card{height:100vh;background:#fff;border:1px solid #ececea;border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;overflow:hidden}
.h{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700}
.pill{border:0;background:#f1f1f0;border-radius:8px;font-size:10px;font-weight:700;color:#888;padding:4px 8px;cursor:pointer}
.big{display:flex;align-items:baseline;gap:10px;margin:8px 0 12px}
.big b{font-size:34px;font-weight:800;letter-spacing:-1px}.big span{font-size:11px;color:#aaa;font-weight:600}
.dots{flex:1;display:flex;flex-wrap:wrap;gap:5px;align-content:flex-start;overflow:hidden;min-height:0}
.dots i{width:8px;height:8px;border-radius:50%;background:#e9e9e9}.dots i.f{background:#222}
.ed{display:none;gap:6px;font-size:11px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.ed input{border:1px solid #ddd;border-radius:6px;padding:3px 5px;font-size:11px;font-family:inherit}
</style></head><body><div class="card"><div class="h"><span id="nm"></span><button class="pill" id="eb">Edit</button></div>
<div class="big"><b id="dd"></b><span id="ds"></span></div>
<div class="ed" id="ed"><input id="n" size="10" placeholder="Name"> Start <input type="date" id="s1"> Day <input type="date" id="s2"></div>
<div class="dots" id="dots"></div></div>
<script>
function $(i){return document.getElementById(i)}
var cfg={n:'Finals',s:'2026-08-24',e:'2026-12-07'};try{var v=JSON.parse(localStorage.getItem('dday'));if(v&&v.s&&v.e)cfg=v}catch(x){}
function dy(s){var p=s.split('-');return new Date(+p[0],p[1]-1,+p[2])}
function r(){var s=dy(cfg.s),e=dy(cfg.e),n=new Date();n=new Date(n.getFullYear(),n.getMonth(),n.getDate());var tot=Math.max(1,Math.round((e-s)/864e5)),done=Math.min(tot,Math.max(0,Math.round((n-s)/864e5))),left=Math.round((e-n)/864e5);
$('nm').textContent=cfg.n||'D-day';$('dd').textContent=left>0?'D-'+left:(left===0?'D-DAY':'D+'+(-left));$('ds').textContent=done+' / '+tot+' days · '+Math.round(done/tot*100)+'%';
var h='';for(var i=0;i<tot;i++)h+='<i'+(i<done?' class="f"':'')+'></i>';$('dots').innerHTML=h;$('n').value=cfg.n||'';$('s1').value=cfg.s;$('s2').value=cfg.e}
$('eb').onclick=function(){var d=$('ed');d.style.display=d.style.display==='flex'?'none':'flex'};
function sv(){if($('s1').value&&$('s2').value){cfg={n:$('n').value,s:$('s1').value,e:$('s2').value};try{localStorage.setItem('dday',JSON.stringify(cfg))}catch(x){}r()}}
$('n').onchange=sv;$('s1').onchange=sv;$('s2').onchange=sv;r();
</script></body></html>
