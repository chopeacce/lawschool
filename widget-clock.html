<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clock</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:transparent;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;color:#222}
.card{position:relative;height:100vh;background:#fff;border:1px solid #ececea;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4vmin;overflow:hidden}
.pill{position:absolute;top:12px;right:12px;border:0;background:#f1f1f0;border-radius:8px;font-size:10px;font-weight:700;color:#888;padding:4px 8px;cursor:pointer}
.row{display:flex;align-items:center;gap:1.5vmin}
.d{position:relative;width:min(17vw,30vh);height:min(24vw,42vh);background:#222;color:#fff;border-radius:min(2.5vw,4vh);display:flex;align-items:center;justify-content:center;font-size:min(15vw,26vh);font-weight:800}
.d:after{content:"";position:absolute;left:0;right:0;top:50%;height:2px;background:#fff}
.c{color:#ccc;font-weight:800;font-size:min(8vw,14vh);margin:0 .5vmin}
.day{font-size:11px;font-weight:700;letter-spacing:2px;color:#aaa;text-transform:uppercase}
</style></head><body><div class="card"><button class="pill" id="hb">24H</button><div class="row"><div class="d" id="a"></div><div class="d" id="b"></div><div class="c">:</div><div class="d" id="c"></div><div class="d" id="e"></div></div><div class="day" id="day"></div></div>
<script>
function $(i){return document.getElementById(i)}var h24=true;
try{h24=localStorage.getItem('h24')!=='0'}catch(x){}
function t(){var n=new Date(),h=n.getHours();if(!h24){h=h%12||12}var s=String(h).padStart(2,'0')+String(n.getMinutes()).padStart(2,'0');$('a').textContent=s[0];$('b').textContent=s[1];$('c').textContent=s[2];$('e').textContent=s[3];$('hb').textContent=h24?'24H':'12H';$('day').textContent=n.toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'})}
$('hb').onclick=function(){h24=!h24;try{localStorage.setItem('h24',h24?'1':'0')}catch(x){}t()};t();setInterval(t,1000);
</script></body></html>
